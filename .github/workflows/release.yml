name: Validate, package and release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: just20minutes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
      - name: Syntax check
        run: |
          find Just20Minutes tests -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
      - name: Mock-client regression tests
        run: lua5.1 tests/run.lua
      - name: Validate and package
        run: python3 scripts/package.py
      - name: Read validated version
        id: version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path
          toc = Path('Just20Minutes/Just20Minutes.toc').read_text()
          print('version=' + re.search(r'^## Version: (.+)$', toc, re.M).group(1))
          PY
      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Just20Minutes-v${{ steps.version.outputs.version }}
          path: dist/Just20Minutes-v${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

  release:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Just20Minutes-v${{ needs.validate.outputs.version }}
          path: dist
      - name: Publish new version after all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; leaving it unchanged."
          else
            gh release create "v$VERSION" \
              "dist/Just20Minutes-v$VERSION.zip" \
              --target "$GITHUB_SHA" \
              --title "Just 20 Minutes v$VERSION" \
              --notes-file docs/RELEASE_NOTES.md
          fi
      - name: Present the initial 1.0 release
        if: needs.validate.outputs.version == '1.0.4'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v1.0.4 \
            --title "Just 20 Minutes 1.0" \
            --notes-file docs/RELEASE_NOTES.md \
            --latest
          for tag in v1.0.0 v1.0.1 v1.0.2 v1.0.3; do
            gh release edit "$tag" --draft
          done
